services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jp-hacks-expo
    env_file:
      - .env
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP} 
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - WATCHPACK_POLLING=true 
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    command: bash -lc "npm install && npx expo install --fix && npx expo start --tunnel --port 8081"
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

