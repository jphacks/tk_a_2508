name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: |
          if npm run | grep -qE "\blint\b"; then npm run lint; else echo "No lint script"; fi

      - name: Typecheck
        run: |
          if npm run | grep -qE "\btype-check\b|\btypecheck\b"; then (npm run type-check || npm run typecheck); else echo "No typecheck script"; fi

      - name: Test
        run: |
          if npm run | grep -qE "\btest\b"; then npm test -- --ci --watchAll=false; else echo "No test script"; fi

